:root{
  --bg:#E9EDF3; --surface:#FFFFFF; --surface2:#F4F6FA; --ink:#172031; --muted:#667085; --line:#DCE1EA;
  --accent:#2B39D1; --accent-ink:#FFFFFF; --accent-soft:#E2E5FF;
  --pay:#B45309; --pay-strong:#D97706; --pay-soft:#FEF1D6;
  --good:#0F8A55; --good-soft:#DBF3E6; --bad:#CC3434; --bad-soft:#FBE2E0;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 8px 24px rgba(20,30,50,.08);
  --font:"Anuphan",system-ui,-apple-system,"Noto Sans Thai","Segoe UI",sans-serif;
  --display:"Mitr","Anuphan",system-ui,"Noto Sans Thai",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F131A; --surface:#1A2029; --surface2:#141922; --ink:#E7EBF2; --muted:#98A2B5; --line:#2A3240;
    --accent:#7C88FF; --accent-ink:#0F131A; --accent-soft:#252C55;
    --pay:#FBBF24; --pay-strong:#F59E0B; --pay-soft:#33290F;
    --good:#43C98A; --good-soft:#15352A; --bad:#FF6B6B; --bad-soft:#3A1D20;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F131A; --surface:#1A2029; --surface2:#141922; --ink:#E7EBF2; --muted:#98A2B5; --line:#2A3240;
  --accent:#7C88FF; --accent-ink:#0F131A; --accent-soft:#252C55;
  --pay:#FBBF24; --pay-strong:#F59E0B; --pay-soft:#33290F;
  --good:#43C98A; --good-soft:#15352A; --bad:#FF6B6B; --bad-soft:#3A1D20;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:16px;font-weight:600;font-size:17px;transition:transform .08s ease}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:disabled{opacity:.35;cursor:not-allowed}
.btn-pay{background:var(--pay-strong);color:#fff}
.btn-pay:disabled{opacity:.35;cursor:not-allowed}
.btn-ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn-danger{background:var(--bad-soft);color:var(--bad)}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn:active{background:var(--surface2)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.field{width:100%;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:0 14px;font-size:17px;outline:none}
.field:focus{border-color:var(--accent)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}

.face{--c:#888;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:28px;line-height:1;background:var(--tint);border:3px solid var(--c);flex:none;position:relative}
.face.sm{width:32px;height:32px;font-size:17px;border-width:2px}
.face.xs{width:22px;height:22px;font-size:12px;border-width:1.5px}
.face.lg{width:112px;height:112px;font-size:62px;border-width:5px}

/* home */
.home{flex:1;display:flex;flex-direction:column;min-height:0}
.home-head{padding:22px 20px 8px}
.home-head h1{font-family:var(--display);font-weight:500;font-size:30px;margin:0}
.home-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.trip-list{flex:1;overflow-y:auto;padding:10px 16px 16px;display:flex;flex-direction:column;gap:12px}
.trip-card{display:block;width:100%;text-align:left;background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.trip-card h2{font-family:var(--display);font-weight:500;font-size:21px;margin:0 0 2px}
.trip-card .meta{color:var(--muted);font-size:14px}
.trip-card .total{font-family:var(--display);font-size:26px;font-weight:500;margin-top:10px}
.stack{display:flex;margin-top:12px}
.stack .face{margin-left:-8px;box-shadow:0 0 0 2px var(--surface)}
.stack .face:first-child{margin-left:0}
.home-foot{padding:12px 16px 16px;display:flex;flex-direction:column;gap:8px}
.home-foot .btn{width:100%}
.linkbtn{min-height:44px;color:var(--accent);font-weight:600;font-size:15px}

/* setup */
.setup{flex:1;display:flex;flex-direction:column;min-height:0;padding:12px 20px 18px}
.setup-top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--accent)}
.setup-body{flex:1;overflow-y:auto;padding-top:22px}
.setup h1{font-family:var(--display);font-weight:500;font-size:28px;line-height:1.25;margin:0 0 6px}
.setup .lead{color:var(--muted);margin:0 0 22px}
.setup-foot{display:flex;gap:10px;padding-top:12px}
.setup-foot .btn-primary{flex:1}
.cur-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.cur{border:2px solid var(--line);border-radius:14px;padding:10px 8px;background:var(--surface);text-align:center}
.cur b{display:block;font-size:18px}
.cur span{font-size:12px;color:var(--muted)}
.cur.on{border-color:var(--accent);background:var(--accent-soft)}
.stepper{display:flex;align-items:center;justify-content:center;gap:22px;margin:30px 0}
.stepper button{width:64px;height:64px;border-radius:50%;background:var(--surface);border:2px solid var(--line);font-size:30px}
.stepper output{font-family:var(--display);font-size:84px;font-weight:500;min-width:110px;text-align:center;line-height:1}
.member-setup{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px}
.member-setup .swap{font-size:14px;color:var(--accent);font-weight:600;min-height:40px}
.mini-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.mini{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;width:56px;color:var(--muted);text-align:center}
.mini .face{opacity:.4}
.mini.done .face,.mini.cur-m .face{opacity:1}

/* trip */
.trip{flex:1;display:flex;flex-direction:column;min-height:0}
.tbar{display:flex;align-items:center;gap:2px;padding:6px 6px 4px}
.tbar .tt{flex:1;min-width:0;padding:0 2px}
.tbar h1{font-family:var(--display);font-weight:500;font-size:19px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.tbar p{margin:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar p b{color:var(--ink);font-weight:700}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:2px;margin:0 6px 6px}
.seg button{flex:1;min-height:34px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.searchbar{padding:0 6px 6px;display:flex;flex-direction:column;gap:6px}
.searchbar .field{min-height:40px;font-size:16px;border-radius:12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.filter-note{margin:0 6px 6px;padding:6px 10px;border-radius:10px;background:var(--accent-soft);font-size:12.5px}
.tmain{flex:1;min-height:0;display:flex;flex-direction:column}

/* ledger */
.grid-scroll{flex:0 1 auto;min-height:0;max-height:100%;overflow:auto;margin:0 6px;border-radius:14px;background:var(--surface);border:1px solid var(--line);position:relative;overscroll-behavior:contain}
.ledger{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:var(--fs)}
.ledger th,.ledger td{padding:0 4px;height:var(--rh);border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:middle;overflow:hidden;text-overflow:clip;letter-spacing:-.1px}
.ledger col.ca{width:var(--wa)} .ledger col.cb{width:var(--wb)} .ledger col.cm{width:var(--wm)}
.ledger thead th{position:sticky;top:0;z-index:3;height:calc(var(--rh) + 8px);background:var(--surface);font-weight:600;font-size:calc(var(--fs) - .5px);color:var(--muted)}
.ledger .sa{position:sticky;left:0;z-index:2;text-align:left;padding-left:6px}
.ledger .sb{position:sticky;left:var(--wa);z-index:2;box-shadow:inset -1px 0 0 var(--line)}
.ledger thead .sa,.ledger thead .sb{z-index:4;background:var(--surface)}
.ledger tbody .sb{background:var(--surface)}
.ledger thead th.m{padding:3px 2px 0;color:var(--ink)}
.mh{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;height:100%;border-radius:9px 9px 0 0;line-height:1.15}
.mh .e{font-size:calc(var(--fs) + 1px)}
.mh .n{max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:calc(var(--fs) - 1px);padding:0 3px}
.ledger tbody tr{cursor:pointer}
.ledger tbody tr:active td{filter:brightness(.95)}
.xa{display:flex;align-items:center;gap:3px;min-width:0}
.xa .ic{font-size:calc(var(--fs) - 1px);flex:none;line-height:1}
.xa .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.xa .nm.unnamed{font-weight:500;color:var(--muted)}
.ledger td.cb-v{font-weight:700}
.cell{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;line-height:1.1}
.cell .paid{font-size:calc(var(--fs) - 3px);font-weight:600}
.zero{color:var(--muted);opacity:.45}
.ledger tfoot td{background:var(--surface2);font-weight:700;height:calc(var(--rh) + 2px)}
.ledger tfoot tr:first-child td{border-top:3.5px solid var(--ink)}
.ledger tbody tr:last-child td{border-bottom:0}
.ledger tfoot .sa{white-space:normal;line-height:1.15;font-size:calc(var(--fs) - 1px);font-weight:600}
.ledger tfoot .sb{background:var(--surface2)}
.ledger tfoot tr:last-child td{border-bottom:0;height:calc(var(--rh) + 8px)}
.lbl-good{color:var(--good)} .lbl-bad{color:var(--bad)}
.net{display:inline-flex;flex-direction:column;align-items:flex-end;line-height:1.05}
.net small{font-size:calc(var(--fs) - 3.5px);font-weight:600}
.net.pos{color:var(--good)} .net.neg{color:var(--bad)} .net.nil{color:var(--muted)}
@keyframes flash{0%{box-shadow:inset 0 0 0 999px rgba(43,57,209,.25)}100%{box-shadow:inset 0 0 0 999px rgba(43,57,209,0)}}
.ledger tr.flash td{animation:flash 1.6s ease-out}

.empty{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.empty .faces{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-bottom:26px}
.empty .faces div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600}
.empty h2{font-family:var(--display);font-weight:500;font-size:22px;margin:0 0 6px}
.empty p{color:var(--muted);margin:0;max-width:30ch}

.settle{flex:1;overflow-y:auto;padding:0 10px 12px}
.settle h3{font-family:var(--display);font-weight:500;font-size:17px;margin:10px 4px 8px}
.bal{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:6px}
.bal .who{font-weight:600}
.bal .sub{font-size:12px;color:var(--muted)}
.pill{padding:5px 11px;border-radius:999px;font-weight:700;font-size:15px;white-space:nowrap;text-align:right;line-height:1.15}
.pill small{display:block;font-size:10.5px;font-weight:600}
.pill.pos{background:var(--good-soft);color:var(--good)}
.pill.neg{background:var(--bad-soft);color:var(--bad)}
.pill.nil{background:var(--surface2);color:var(--muted)}
.xfer{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:6px}
.xfer .p{display:flex;flex-direction:column;align-items:center;gap:3px;width:66px;font-size:12.5px;font-weight:600;text-align:center}
.xfer .p span{max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xfer .mid{flex:1;display:flex;flex-direction:column;align-items:center}
.xfer .mid b{font-family:var(--display);font-weight:500;font-size:19px}
.xfer .mid .ar{width:100%;height:10px;position:relative}
.xfer .mid .ar::before{content:"";position:absolute;left:0;right:8px;top:4px;height:2px;background:var(--muted)}
.xfer .mid .ar::after{content:"";position:absolute;right:0;top:0;border-left:10px solid var(--muted);border-top:5px solid transparent;border-bottom:5px solid transparent}
.xfer .mid small{color:var(--muted);font-size:12px}
.done-note{text-align:center;padding:26px 10px;color:var(--muted)}

.dock{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:6px 6px 8px}
.catbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:54px;border-radius:15px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:600;box-shadow:0 3px 10px rgba(43,57,209,.25)}
.catbtn .e{font-size:20px;line-height:1.1}
.catbtn:active{transform:scale(.95)}

/* flow */
#flow{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#flow[hidden]{display:none}
.flow{width:100%;max-width:560px;display:flex;flex-direction:column;min-height:0;height:100%}
.fbar{display:flex;align-items:center;gap:6px;padding:6px 8px 0}
.fbar .ft{flex:1;text-align:center;font-weight:600;font-size:14px;color:var(--muted)}
.fbody{flex:1;overflow-y:auto;padding:8px 16px 12px;display:flex;flex-direction:column}
.ffoot{display:flex;gap:8px;padding:8px 14px 12px;align-items:center}
.ffoot .grow-btn{flex:1}
.catpick{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
.catpick::-webkit-scrollbar{display:none}
.catpick button{flex:none;min-height:36px;padding:0 11px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-size:13.5px}
.catpick button.on{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:600}
.bigamt{display:flex;align-items:center;gap:8px;border-bottom:3px solid var(--line);padding-bottom:2px;margin:6px 0 14px}
.bigamt:focus-within{border-color:var(--accent)}
.bigamt .sym{font-family:var(--display);font-size:32px;color:var(--muted)}
.curbtn{display:flex;flex-direction:column;align-items:center;line-height:1;padding:6px 8px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line)}
.curbtn small{font-family:var(--font);font-size:10.5px;font-weight:700;margin-top:3px;color:var(--muted)}
.rate{display:flex;align-items:center;gap:6px;margin:-6px 0 12px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.rate input{width:96px;min-height:40px;border-radius:10px;border:2px solid var(--line);background:var(--surface);padding:0 10px;font-size:16px;font-weight:600;text-align:right;outline:none}
.rate input:focus{border-color:var(--accent)}
.rate b{color:var(--ink);margin-left:auto}
.fx-mark{font-size:.75em;font-weight:600;color:var(--muted);margin-right:2px}
.bigamt input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-family:var(--display);font-size:44px;font-weight:500;padding:0;line-height:1.2}
.status{font-size:14px;font-weight:600;text-align:center;min-height:20px;margin-top:8px}
.status.bad{color:var(--bad)} .status.ok{color:var(--good)}
.hint{font-size:13.5px;color:var(--muted);text-align:center;margin:10px 0 0}

/* PAY section: amber, list rows, wallet */
.paysec{background:var(--pay-soft);border-radius:20px;padding:12px 12px 10px;border:2px solid var(--pay-strong)}
.sec-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec-hd h2{margin:0;font-family:var(--display);font-weight:500;font-size:20px;color:var(--pay);line-height:1.2}
.sec-hd h2 small{display:block;font-family:var(--font);font-size:12.5px;font-weight:500;color:var(--muted)}
.multi{flex:none;min-height:36px;padding:0 10px;border-radius:10px;border:1.5px solid var(--pay-strong);font-size:12.5px;font-weight:600;color:var(--pay);background:var(--surface)}
.multi.on{background:var(--pay-strong);color:#fff}
.plist{display:flex;flex-direction:column;gap:6px}
.payrow{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 12px;border-radius:14px;background:var(--surface);border:2px solid transparent;text-align:left}
.payrow .n{flex:1;font-weight:600;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.payrow .mark{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff;flex:none}
.payrow.multi-mode .mark{border-radius:7px}
.payrow.on{border-color:var(--c);background:var(--tint)}
.payrow.on .mark{background:var(--c);border-color:var(--c)}
.payhead{display:flex;align-items:center;gap:8px;margin:0 0 10px;padding:10px 12px;border-radius:14px;background:var(--pay-soft);color:var(--pay);font-family:var(--display);font-size:20px}

/* two-payer slider */
.vs{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;justify-content:center}
.vs-end{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--c);border-radius:18px;padding:8px 14px;min-width:240px}
.vs-end .n{font-weight:600;flex:1;text-align:left}
.vs-end b{font-family:var(--display);font-weight:500;font-size:24px}
.vs-end .ed{font-size:11px;color:var(--muted);display:block;text-align:right;font-weight:500}
.vs-track{position:relative;width:70px;height:min(38vh,320px);border-radius:35px;touch-action:none;cursor:grab;background:var(--line)}
.vs-fill{position:absolute;left:0;right:0}
.vs-fill.a{top:0;border-radius:35px 35px 0 0}
.vs-fill.b{bottom:0;border-radius:0 0 35px 35px}
.vs-thumb{position:absolute;left:50%;width:90px;height:40px;margin:-20px 0 0 -45px;border-radius:20px;background:var(--surface);border:3px solid var(--ink);display:grid;place-items:center;font-size:18px;font-weight:700;box-shadow:var(--shadow)}
.vs-tick{position:absolute;right:-30px;font-size:10px;color:var(--muted);transform:translateY(-50%);pointer-events:none}
.quick{display:flex;gap:8px;justify-content:center;margin-top:4px;flex-wrap:wrap}
.quick button{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600}
.pinrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--c);border-radius:16px;padding:8px 12px}
.pinrow .n{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinrow input{width:120px;min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);text-align:right;padding:0 12px;font-size:18px;font-weight:600;outline:none}
.pinrow input:focus{border-color:var(--accent)}

/* SPLIT screen: blue, circle grid, stamps */
.splithead{background:var(--accent);color:var(--accent-ink);border-radius:22px;padding:12px 16px 14px;text-align:center;margin-bottom:14px}
.splithead h2{margin:0;font-family:var(--display);font-weight:500;font-size:21px}
.splithead .big{font-family:var(--display);font-size:46px;font-weight:500;line-height:1.1}
.splithead .of{font-size:13px;opacity:.85}
.splithead .by{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:3px 10px 3px 4px;border-radius:999px;background:rgba(255,255,255,.18);font-size:12.5px;font-weight:600}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px;padding:4px 2px 6px}
.sp{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;border-radius:18px;position:relative}
.sp .face{width:64px;height:64px;font-size:35px;transition:transform .15s,opacity .15s}
.sp .n{font-size:13.5px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp.off .face{opacity:.4;filter:grayscale(.6)}
.sp.sel .face{background:var(--c);transform:scale(1.04)}
.sp.pickable .face{box-shadow:0 0 0 4px var(--accent-soft)}
.stampslot{height:24px;margin-top:-17px;display:flex;justify-content:center;position:relative;z-index:1;pointer-events:none}
.stamp{display:inline-flex;align-items:center;gap:3px;font-family:var(--display);font-size:13.5px;font-weight:500;line-height:1;padding:4px 9px;border-radius:9px;color:var(--cd);background:linear-gradient(var(--tint),var(--tint)),var(--surface);border:1.5px solid var(--c);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 4px 10px rgba(20,30,50,.14);transform:rotate(-4deg);white-space:nowrap}
.stamp.fx{background:var(--c);color:var(--ci)}
.stamp.fx::before{content:"✎";font-size:10px;opacity:.8}
.stamp.ghost{visibility:hidden}
@keyframes thump{0%{transform:rotate(-4deg) scale(1.5);opacity:0}60%{transform:rotate(-4deg) scale(.95);opacity:1}100%{transform:rotate(-4deg) scale(1)}}
.stamp.new{animation:thump .22s ease-out}
.splitbtns{display:flex;align-items:center;gap:8px;flex:1}
.btn-eq{flex:1;min-height:56px;border-radius:18px;font-size:18px;font-weight:700;background:var(--surface);border:2.5px solid var(--accent);color:var(--accent)}
.btn-eq.armed{background:var(--good);border-color:var(--good);color:#fff}
.btn-uneq{min-height:44px;padding:0 12px;border-radius:14px;font-size:13px;font-weight:600;background:var(--surface2);border:1px solid var(--line)}
.btn-uneq.on{background:var(--ink);color:var(--surface)}

/* modal */
#modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(10,14,22,.45)}
.sheet{position:relative;width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:20px 20px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h3{font-family:var(--display);font-weight:500;font-size:21px;margin:0 0 6px}
.sheet p{margin:0 0 14px;color:var(--muted)}
.sheet .acts{display:flex;gap:10px;margin-top:16px}
.sheet .acts .btn{flex:1}
.menu{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.menu button{display:flex;align-items:center;gap:14px;min-height:52px;padding:0 10px;border-radius:14px;text-align:left;font-weight:500;font-size:16px}
.menu button:active{background:var(--surface2)}
.menu .e{font-size:22px;width:30px;text-align:center}
.menu .danger{color:var(--bad)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.note{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.5}
.medit{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.medit .row .field{min-height:48px;font-size:16px}
.dsec{border-radius:14px;padding:10px 12px;margin-top:10px}
.dsec.pay{background:var(--pay-soft)}
.dsec.split{background:var(--accent-soft)}
.dsec .dh{font-size:13px;font-weight:700;margin-bottom:6px}
.dsec.pay .dh{color:var(--pay)}
.line{display:flex;align-items:center;gap:10px;padding:3px 0}
.line .n{flex:1;font-weight:500}
.dtf{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:0 12px;width:100%;font-size:16px;margin-top:4px}
.xl-sum{background:var(--surface2);border-radius:14px;padding:10px 14px;margin:6px 0 4px}

/* privacy page */
.page{flex:1;display:flex;flex-direction:column;min-height:0}
.page-body{flex:1;overflow-y:auto;padding:6px 16px 20px}
.plist-priv{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plist-priv li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.plist-priv .ok{width:26px;height:26px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;font-weight:700;flex:none}
.plist-priv b{display:block;font-weight:600}
.plist-priv small{display:block;color:var(--muted);font-size:12.5px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 14px;margin-top:12px}
.stat div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.stat div:last-child{border-bottom:0}
.stat span{color:var(--muted)}
.stat .sub-row span{padding-left:14px}
.stat .sub-row{font-size:13px}
.stat .head{font-weight:700;color:var(--ink)}
.ph{font-family:var(--display);font-weight:500;font-size:18px;margin:18px 2px 6px}
.page .menu{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px}
.menu button small{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.menu button.danger small{color:var(--bad);opacity:.8}
code{font-size:.9em;background:var(--surface2);padding:1px 4px;border-radius:4px}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:14px;font-size:14px;font-weight:600;max-width:90vw;text-align:center;box-shadow:var(--shadow);pointer-events:none;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="flow" hidden></div>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
